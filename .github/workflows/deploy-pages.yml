name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish site to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          site="$(mktemp -d)"
          cp -r index.html vendor README.md "$site"/
          touch "$site/.nojekyll"
          cd "$site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA} to GitHub Pages"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

      - name: Ensure Pages is enabled (source = gh-pages /root)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          body='{"source":{"branch":"gh-pages","path":"/"}}'
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST "${hdr[@]}" "$api" -d "$body" || echo "000")
          echo "POST /pages -> $code"; cat /tmp/pages.json 2>/dev/null || true; echo
          if [ "$code" = "409" ]; then
            code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT "${hdr[@]}" "$api" -d "$body" || echo "000")
            echo "PUT /pages -> $code"
          fi
          # Request a build so the new content is published
          curl -sS -o /dev/null -X POST "${hdr[@]}" "$api/builds" || true
          echo "Pages source set to gh-pages /root (if HTTP was 201/204)."
